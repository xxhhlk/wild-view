name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 要验证的分支、标签或提交；留空时验证当前事件的代码
        required: false
        type: string
        default: ''
    outputs:
      commit:
        description: 已通过验证的提交 SHA
        value: ${{ jobs.verify.outputs.commit }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Record source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Frontend static check
        run: node scripts/ui-static-check.mjs
