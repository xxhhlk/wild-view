name: T-build
true:
  workflow_dispatch: null
jobs:
  build:
    strategy:
      matrix:
        include:
        - name: windows-amd64
          os: ubuntu-latest
          goos: windows
          goarch: amd64
          cgo: '0'
          ldflags: -H windowsgui
          needs_rsrc: true
          suffix: .exe
        - name: macos-arm64
          os: macos-latest
          goos: darwin
          goarch: arm64
          cgo: '1'
          suffix: ''
          pack_app: true
        - name: macos-amd64
          os: macos-latest
          goos: darwin
          goarch: amd64
          cgo: '1'
          suffix: ''
          pack_app: true
        - name: linux-amd64
          os: ubuntu-latest
          goos: linux
          goarch: amd64
          cgo: '0'
          suffix: ''
        - name: linux-arm64
          os: ubuntu-latest
          goos: linux
          goarch: arm64
          cgo: '0'
          suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'push' && github.ref || 'master' }}
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
    - name: Generate icon resource (rsrc)
      if: matrix.needs_rsrc
      run: 'go install github.com/akavel/rsrc@latest

        cp build/windows/icon.ico cmd/wild-view/icon.ico

        rsrc -ico cmd/wild-view/icon.ico -o cmd/wild-view/rsrc_windows_amd64.syso

        '
    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: ${{ matrix.cgo }}
      run: 'OUT="dist/wild-view-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix
        }}"

        go build -tags devdump -ldflags "${{ matrix.ldflags }}" -o "$OUT" ./cmd/wild-view

        '
    - name: Frontend static check
      if: matrix.name == 'linux-amd64'
      run: node scripts/ui-static-check.mjs
    - name: Check trailing newline of changed files (advisory)
      if: matrix.name == 'linux-amd64'
      continue-on-error: true
      run: "BASE=\"origin/master\"\nif git rev-parse --verify --quiet \"$BASE\" >/dev/null;\
        \ then\n  CHANGED=$(git diff --name-only --diff-filter=ACM \"$BASE\"...HEAD\
        \ || true)\nelse\n  CHANGED=$(git diff --name-only --diff-filter=ACM HEAD~1\
        \ HEAD 2>/dev/null || true)\nfi\nN=$(printf '%s\\n' \"$CHANGED\" | grep -c\
        \ . || true)\necho \"待检查的改动文件数: $N\"\nprintf '%s\\n' \"$CHANGED\" | while\
        \ IFS= read -r f; do\n  [ -z \"$f\" ] && continue\n  case \"$f\" in\n    *.go|*.js|*.css|*.html|*.mjs|*.yml|*.md)\
        \ ;;\n    *) continue ;;\n  esac\n  [ -f \"$f\" ] || continue\n  if [ -s \"\
        $f\" ] && [ -n \"$(tail -c 1 \"$f\")\" ]; then\n    echo \"::warning file=$f::缺少文件末尾换行\"\
        \n  fi\ndone\n"
    - name: Package macOS .app + .dmg
      if: matrix.pack_app
      env:
        ARCH: ${{ matrix.goarch }}
        REQUIRE_DMG: '1'
      run: bash build/macos/build-app.sh
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: dist/wild-view-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix
          }}
    - name: Upload macOS .dmg
      if: matrix.pack_app
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-dmg
        path: dist/WildWork-*-${{ matrix.goarch }}.dmg
        if-no-files-found: error
