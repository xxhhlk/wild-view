name: T-release
true:
  workflow_dispatch: null
jobs:
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'push' && github.ref || 'master' }}
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create or update dev release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "# 收集产物（每个 artifact 一个子目录，find 平铺）\nmkdir -p release-assets\nfind artifacts\
        \ -type f -exec cp {} release-assets/ \\;\necho \"=== release-assets 内容 ===\"\
        \nls -la release-assets/\n\n# tag 触发 → 创建新正式 release（不会碰其他分支的 release）\nif\
        \ [[ \"${{ github.event_name }}\" == \"push\" ]]; then\n  TAG=\"${GITHUB_REF#refs/tags/}\"\
        \n  # release note 取自仓库根目录的 RELEASES.md（按版本从旧到新，新版本 append 到末尾），\n  # 截取对应版本段落（`#\
        \ wild-view <tag>` 起，到下一个 `# wild-view vX.Y.Z` 止）作为手写摘要，\n  # 而非 --generate-notes（后者只给\
        \ commit 链接列表，没有面向用户的变更摘要）。\n  # 兼容旧的独立文件 RELEASE-<tag>.md（若存在则优先）。\n  # 都找不到时回退到\
        \ --generate-notes，不阻塞发版。\n  NOTES=\"RELEASE-${TAG}.md\"\n  if [[ -f \"$NOTES\"\
        \ ]]; then\n    echo \"=== 使用独立文件 $NOTES 作为 release note ===\"\n    gh release\
        \ create \"$TAG\" release-assets/* --title \"$TAG\" --notes-file \"$NOTES\"\
        \n  elif [[ -f RELEASES.md ]]; then\n    # 段落边界用「下一个 `# wild-view vX.Y.Z`」而非版本号后缀比较，\n\
        \    # 避免 v2.6.3 误匹配到 v2.6.30 之类的标题。\n    awk -v tag=\"$TAG\" '\n      $0\
        \ ~ (\"^# wild-view \" tag \"([^0-9.]|$)\") { p=1 }\n      p && /^# wild-view\
        \ / && $0 !~ (\"^# wild-view \" tag \"([^0-9.]|$)\") { exit }\n      p { print\
        \ }\n    ' RELEASES.md > /tmp/release-notes.md\n    if [[ -s /tmp/release-notes.md\
        \ ]]; then\n      echo \"=== 使用 RELEASES.md 中 $TAG 段落作为 release note（$(wc\
        \ -l < /tmp/release-notes.md) 行） ===\"\n      gh release create \"$TAG\" release-assets/*\
        \ --title \"$TAG\" --notes-file /tmp/release-notes.md\n    else\n      echo\
        \ \"=== RELEASES.md 中未找到 $TAG 段落，回退到自动生成 notes ===\"\n      gh release create\
        \ \"$TAG\" release-assets/* --generate-notes\n    fi\n  else\n    echo \"\
        === 既无 $NOTES 也无 RELEASES.md，回退到自动生成 notes ===\"\n    gh release create \"\
        $TAG\" release-assets/* --generate-notes\n  fi\n  exit 0\nfi\n# workflow_dispatch\
        \ → 每次更新同一个 dev-build 专属 release\n# 复用固定 tag，避免堆积；不会删除 master 分支的任何发布包\nDEV_TAG=\"\
        dev-build\"\nif gh release view \"$DEV_TAG\" >/dev/null 2>&1; then\n  gh release\
        \ delete \"$DEV_TAG\" --yes --cleanup-tag\nfi\ngh release create \"$DEV_TAG\"\
        \ release-assets/* --prerelease \\\n  --title \"Dev Build $(date '+%Y-%m-%d\
        \ %H:%M')\" \\\n  --notes \"Dev 分支自动构建（commit ${{ github.sha }}）\"\n"
